apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-dashboard
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/part-of: kube-prometheus-stack
# NOTE: Dashboards deployed via this ConfigMap are read-only in Grafana.
# You cannot save changes directly through the UI. 
# To export the dashboard as JSON, first save it as a copy in Grafana, 
# then export that copy.
data:
  {{ .Release.Name }}-dashboard.json: |-
    {
      "apiVersion": "dashboard.grafana.app/v2",
      "kind": "Dashboard",
      "spec": {
        "annotations": [
          {
            "kind": "AnnotationQuery",
            "spec": {
              "query": {
                "kind": "DataQuery",
                "group": "grafana",
                "version": "v0",
                "datasource": {
                  "name": "-- Grafana --"
                },
                "spec": {}
              },
              "enable": true,
              "hide": true,
              "iconColor": "rgba(0, 211, 255, 1)",
              "name": "Annotations & Alerts",
              "builtIn": true
            }
          }
        ],
        "cursorSync": "Off",
        "editable": true,
        "elements": {
          "panel-1": {
            "kind": "Panel",
            "spec": {
              "id": 1,
              "title": "Ambient Temperature by Sensor",
              "description": "Shows real-time ambient temperature streams for active sensors matching the dropdown selection.",
              "links": [],
              "data": {
                "kind": "QueryGroup",
                "spec": {
                  "queries": [
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "query": {
                          "kind": "DataQuery",
                          "group": "prometheus",
                          "version": "v0",
                          "datasource": {
                            "name": "prometheus"
                          },
                          "spec": {
                            "editorMode": "code",
                            "expr": "cm_ambient_temp_celsius{sensor_id=~\"$sensor\"}",
                            "legendFormat": "{{`{{sensor_id}}`}}",
                            "range": true
                          }
                        },
                        "refId": "A",
                        "hidden": false
                      }
                    }
                  ],
                  "transformations": [],
                  "queryOptions": {}
                }
              },
              "vizConfig": {
                "kind": "VizConfig",
                "group": "timeseries",
                "version": "13.0.1",
                "spec": {
                  "options": {
                    "annotations": {
                      "clustering": -1,
                      "multiLane": false
                    },
                    "legend": {
                      "calcs": [
                        "lastNotNull"
                      ],
                      "displayMode": "table",
                      "placement": "bottom",
                      "showLegend": true
                    },
                    "tooltip": {
                      "hideZeros": false,
                      "mode": "multi",
                      "sort": "desc"
                    }
                  },
                  "fieldConfig": {
                    "defaults": {
                      "thresholds": {
                        "mode": "absolute",
                        "steps": [
                          {
                            "value": 0,
                            "color": "green"
                          },
                          {
                            "value": 35,
                            "color": "red"
                          }
                        ]
                      },
                      "color": {
                        "mode": "palette-classic"
                      },
                      "custom": {
                        "axisBorderShow": false,
                        "axisCenteredZero": false,
                        "axisColorMode": "text",
                        "axisLabel": "°C",
                        "axisPlacement": "auto",
                        "barAlignment": 0,
                        "barWidthFactor": 0.6,
                        "drawStyle": "line",
                        "fillOpacity": 5,
                        "gradientMode": "opacity",
                        "hideFrom": {
                          "legend": false,
                          "tooltip": false,
                          "viz": false
                        },
                        "insertNulls": false,
                        "lineInterpolation": "smooth",
                        "lineWidth": 2,
                        "pointSize": 5,
                        "scaleDistribution": {
                          "type": "linear"
                        },
                        "showPoints": "never",
                        "showValues": false,
                        "spanNulls": false,
                        "stacking": {
                          "group": "A",
                          "mode": "none"
                        },
                        "thresholdsStyle": {
                          "mode": "line"
                        }
                      }
                    },
                    "overrides": []
                  }
                }
              }
            }
          },
          "panel-2": {
            "kind": "Panel",
            "spec": {
              "id": 2,
              "title": "Total Processed Readings",
              "description": "A table breakdown tracking the message throughput per individual sensor.",
              "links": [],
              "data": {
                "kind": "QueryGroup",
                "spec": {
                  "queries": [
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "query": {
                          "kind": "DataQuery",
                          "group": "prometheus",
                          "version": "v0",
                          "datasource": {
                            "name": "prometheus"
                          },
                          "spec": {
                            "editorMode": "code",
                            "expr": "cm_readings_total{sensor_id=~\"$sensor\"}",
                            "legendFormat": "{{`{{sensor_id}}`}}",
                            "range": true
                          }
                        },
                        "refId": "A",
                        "hidden": false
                      }
                    }
                  ],
                  "transformations": [
                    {
                      "kind": "Transformation",
                      "group": "reduce",
                      "spec": {
                        "options": {
                          "reducers": [
                            "last"
                          ]
                        }
                      }
                    }
                  ],
                  "queryOptions": {}
                }
              },
              "vizConfig": {
                "kind": "VizConfig",
                "group": "table",
                "version": "13.0.1",
                "spec": {
                  "options": {
                    "cellHeight": "sm",
                    "showHeader": true
                  },
                  "fieldConfig": {
                    "defaults": {
                      "thresholds": {
                        "mode": "absolute",
                        "steps": [
                          {
                            "value": 0,
                            "color": "blue"
                          }
                        ]
                      },
                      "color": {
                        "mode": "thresholds"
                      },
                      "custom": {
                        "align": "auto",
                        "cellOptions": {
                          "type": "auto"
                        },
                        "footer": {
                          "reducers": []
                        },
                        "inspect": false
                      }
                    },
                    "overrides": []
                  }
                }
              }
            }
          }
        },
        "layout": {
          "kind": "AutoGridLayout",
          "spec": {
            "maxColumnCount": 3,
            "columnWidthMode": "standard",
            "rowHeightMode": "standard",
            "items": [
              {
                "kind": "AutoGridLayoutItem",
                "spec": {
                  "element": {
                    "kind": "ElementReference",
                    "name": "panel-1"
                  }
                }
              },
              {
                "kind": "AutoGridLayoutItem",
                "spec": {
                  "element": {
                    "kind": "ElementReference",
                    "name": "panel-2"
                  }
                }
              }
            ]
          }
        },
        "links": [],
        "liveNow": false,
        "preload": false,
        "tags": [
          "cloudmetrics",
          "{{ .Release.Name }}"
        ],
        "timeSettings": {
          "timezone": "browser",
          "from": "now-15m",
          "to": "now",
          "autoRefresh": "5s",
          "autoRefreshIntervals": [
            "5s",
            "10s",
            "30s"
          ],
          "hideTimepicker": false,
          "fiscalYearStartMonth": 0
        },
        "title": "{{ .Release.Name | title }} Multi-Sensor Metrics",
        "variables": [
          {
            "kind": "QueryVariable",
            "spec": {
              "name": "sensor",
              "label": "Sensor Selection",
              "hide": "dontHide",
              "refresh": "onDashboardLoad",
              "skipUrlSync": false,
              "query": {
                "kind": "DataQuery",
                "group": "prometheus",
                "version": "v0",
                "datasource": {
                  "name": "prometheus"
                },
                "spec": {
                  "qryType": 5,
                  "query": "label_values(cm_ambient_temp_celsius, sensor_id)",
                  "refId": "PrometheusVariableQueryEditor-VariableQuery"
                }
              },
              "regex": "",
              "regexApplyTo": "value",
              "sort": "disabled",
              "definition": "label_values(cm_ambient_temp_celsius, sensor_id)",
              "options": [],
              "multi": false,
              "includeAll": true,
              "allowCustomValue": true
            }
          }
        ],
        "preferences": {
          "layout": {
            "kind": "AutoGridLayout",
            "spec": {
              "maxColumnCount": 3,
              "columnWidthMode": "standard",
              "rowHeightMode": "standard",
              "items": []
            }
          }
        }
      }
    }
