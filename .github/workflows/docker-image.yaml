name: Docker Image CI

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          release-type: simple

  build-and-push:
    needs: release-please
    # Always run on PRs, or if release-please finished on main
    if: always() && (github.event_name == 'pull_request' || needs.release-please.result == 'success')
    runs-on: ubuntu-24.04
    env:
      GIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    - name: Lint Dockerfile
      uses: hadolint/hadolint-action@2332a7b74a6de0dda2e2221d575162eba76ba5e5 # v3.3.0
      with:
        dockerfile: Dockerfile

    - name: Set up Go
      uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
      with:
        go-version: '1.23'
        cache: true

    - name: Build local image for testing
      uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
      with:
        context: .
        push: false
        load: true
        tags: cloudmetrics:smoke-test
        build-args: |
          GIT_SHA=${{ env.GIT_SHA }}

    - name: Run Smoke Test
      working-directory: ./app
      run: go test -v -tags=smoke ./...

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }} # Automatically provided by GitHub
    
    - name: Extract Docker metadata
      id: meta
      uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6.0.0
      env:
          DOCKER_METADATA_PR_HEAD_SHA: true
      with:
        images: ghcr.io/${{ github.repository }}/cloudmetrics-app
        tags: |
          # Tag with the SHA (shortened, no prefix)
          type=sha,prefix=
          # Tag with 'latest' only on the main branch
          type=raw,value=latest,enable={{is_default_branch}}
          # Dynamic injection of the semantic version from Release Please
          type=raw,value=${{ needs.release-please.outputs.tag_name }},enable=${{ needs.release-please.outputs.release_created == 'true' }}

    - name: Build the Docker image
      uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        build-args: |
          GIT_SHA=${{ env.GIT_SHA }}

    - name: Update Chart appVersion (ensures script works)
      run: |
        chmod +x ./.github/workflows/scripts/update-version.sh
        ./.github/workflows/scripts/update-version.sh "${{ needs.release-please.outputs.tag_name }}" "${{ env.GIT_SHA }}"

    - name: Commit and Push Changes to trigger ArgoCD deployment
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        
        git add charts/cloudmetrics/Chart.yaml
        git commit -m "chore(ci): update appVersion [skip ci]"
        git push
